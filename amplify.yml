version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Next.js 15 runs on Amplify's Node.js 20, 22 or 24 compute runtimes.
        - nvm install 22
        - nvm use 22
        - node -v
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Amplify keeps console environment variables out of the SSR runtime unless they are written to .env.production.
        - (env | grep -E '^(NEXT_PUBLIC_|SUPABASE_)' >> .env.production) || true
        # Canonical links, the sitemap and the structured data need the public address. Until a custom domain is set in
        # NEXT_PUBLIC_SITE_URL, fall back to the branch's Amplify address so they never point at localhost.
        - if [ -z "$NEXT_PUBLIC_SITE_URL" ] && [ -n "$AWS_APP_ID" ] && [ -n "$AWS_BRANCH" ]; then echo "NEXT_PUBLIC_SITE_URL=https://$AWS_BRANCH.$AWS_APP_ID.amplifyapp.com" >> .env.production; fi
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
