<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>AOS · בדיקות מערכת</title>
<meta name="robots" content="noindex">
<style>body{margin:0;background:#0c0e11}</style>
</helmet>
<div dir="rtl" style="min-height:100vh;background:#0c0e11;color:#efe9dc;font-family:'Heebo',sans-serif;padding:32px clamp(16px,4vw,48px);box-sizing:border-box">
  <h1 style="font-family:'Frank Ruhl Libre',serif;font-size:40px;margin:0 0 6px">בדיקות מערכת · שכבת הנתונים</h1>
  <p style="margin:0 0 20px;color:#b9b3a5;max-width:760px">הבדיקות רצות על מאגר נפרד בדפדפן (לא נוגעות בנתוני האתר) ונמחקות בסיום.</p>
  <div role="status" style="font-size:22px;margin-bottom:18px;color:{{ sumColor }}">{{ summary }}</div>
  <ol style="margin:0;padding:0 20px;display:flex;flex-direction:column;gap:6px">
    <sc-for list="{{ results }}" as="r" hint-placeholder-count="10"><li style="color:{{ r.color }}"><b>{{ r.mark }}</b> {{ r.name }} <span style="color:#8a8f98;direction:ltr;display:inline-block">{{ r.detail }}</span></li></sc-for>
  </ol>
  <button onClick="{{ rerun }}" style="margin-top:24px;height:44px;padding:0 20px;background:#c9a45c;color:#0c0e11;border:0;cursor:pointer;font-weight:600">הרצה מחדש</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>

        ok('כפילות: מנוי לא יכול 3 שעות 09–12 באותו זמן',A.createHold(B1,{roomId:'R1',date:D,start:9,end:12}).err==='taken');
        ok('כפילות: מנוי לא יכול 12–15 (חפיפה חלקית)',A.createHold(B1,{roomId:'R1',date:D,start:12,end:15}).err==='taken');
        {const r=A.createHold(B1,{roomId:'R1',date:D,start:13,end:18});ok('כפילות: חצי יום 13–18 נחסם (חפיפה של שעה)',r.err==='taken',e(r)+' '+D);}
        {const r=A.createHold(B1,{roomId:'R1',date:D,start:9,end:18});ok('כפילות: יום מלא נחסם',r.err==='taken',e(r));}
        ok('כפילות: אדמין לא יכול לרשום ידנית 09–12',A.adminBooking(M,{roomId:'R1',date:D,start:9,end:12,name:'ידני'}).err==='taken');
        const ad2=A.adminBooking(M,{roomId:'R1',date:D,start:15,end:18,name:'ידני'});
        ok('כפילות: אדמין רושם 15–18 הפנוי',!!ad2.booking,e(ad2));
        ok('כפילות: דייר לא יכול שעה 13 (תפוסה בחצי היום)',A.tenantBook(T2,{date:D,start:13,hours:1}).err==='taken');
        {const r=A.tenantBook(T2,{date:D,start:14,hours:2});ok('כפילות: דייר לא יכול 14–16 (חופף לאדמין)',r.err==='taken',e(r));}
        const tb=A.tenantBook(T2,{date:D,start:14,hours:1});
        ok('כפילות: דייר משריין את השעה הפנויה 14–15',!!tb.booking,e(tb));
        ok('כפילות: אחרי השריון היום מלא לכולם',A.daySlots(A.load(),'R1',D,'p3').every(s=>s.state!=='free')&&A.tenantHours(A.load(),'R1',D).every(s=>s.state!=='free'));
        ok('כפילות: אי אפשר לחסום שעה תפוסה',A.addBlock(M,{roomId:'R1',date:D,start:10,end:11,reason:'x'}).err==='conflict');
        ok('כפילות: בקשת תשלום נשארת על אותו שריון',e(A.requestBooking(A1,h.booking.id))==='ok'&&A.overlaps(A.load()).length===0);
        A._raw(d=>{const b=d.bookings.find(x=>x.id===h.booking.id);b.expires=Date.now()-1000});
        const nb=A.createHold(B1,{roomId:'R1',date:D,start:9,end:12});
        ok('כפילות: שריון שפג תוקפו משתחרר ומנוי לוקח 09–12',!!nb.booking,e(nb));
        ok('כפילות: תשלום מאוחר על השריון שפג נדחה (conflict)',A.recordPayment(M,{bookingId:h.booking.id,amount:h.booking.total,ref:'LATE-1',method:'card'}).err==='conflict');
        ok('כפילות: אישור ידני של השריון שפג נדחה',!!A.confirmUnpaid(M,h.booking.id).err);
        const pay=A.recordPayment(M,{bookingId:nb.booking.id,amount:nb.booking.total,ref:'OK-1',method:'card'});
        ok('כפילות: תשלום על השריון התקף עובר',!!pay.payment,e(pay));
        ok('כפילות: אותו תשלום פעמיים לא נרשם שוב',A.recordPayment(M,{bookingId:nb.booking.id,amount:nb.booking.total,ref:'OK-1',method:'card'}).dup===true&&A.load().payments.filter(p=>p.ref==='OK-1').length===1);
        ok('כפילות: תשלום שני עם אסמכתה אחרת נדחה',A.recordPayment(M,{bookingId:nb.booking.id,amount:nb.booking.total,ref:'OK-2',method:'card'}).err==='already');
        A._raw(d=>{d.bookings.push({...d.bookings.find(x=>x.id===nb.booking.id),id:'FORCED-DUP'})});
        ok('כפילות: בדיקת השלמות מזהה חפיפה שנכפתה ידנית',A.overlaps(A.load()).length>0);
        ok('כפילות: כשיש חפיפה במאגר, כל כתיבה שמוסיפה חפיפה חדשה נחסמת',A.createHold(B1,{roomId:'R1',date:D,start:12,end:15}).err==='taken');
        A._raw(d=>{d.bookings=d.bookings.filter(x=>x.id!=='FORCED-DUP')});
        ok('שישי: רק חלונות שנגמרים עד 15:00',A.daySlots(A.load(),'R1',fri,'p3').every(s=>s.end<=15)&&!A.daySlots(A.load(),'R1',fri,'day').length);
        ok('כפילות: בסוף התרחיש אין אף חפיפה ביומן',A.overlaps(A.load()).length===0);}
      {// Row-level isolation: every actor only acts on its own rows
        A._strict(true);const D2=next(1);A.signOut();A.adminSignOut();
        ok('הפרדה: בלי התחברות אי אפשר לשריין בשם לקוח',A.createHold(A1,{roomId:'R1',date:D2,start:9,end:12}).err==='auth');
        ok('הפרדה: בלי התחברות מנהל אי אפשר לפעולת מנהל',A.confirmUnpaid(M,'x').err==='auth'&&A.updateSettings(M,{}).err==='auth');
        await A.signIn({email:'a@test.example',password:'password-a'});
        ok('הפרדה: לקוח א׳ מחובר לא יכול לפעול בשם לקוח ב׳',A.createHold(B1,{roomId:'R1',date:D2,start:9,end:12}).err==='auth'&&A.updateProfile(B1,{name:'x'}).err==='auth');
        ok('הפרדה: לקוח לא יכול להתחזות למנהל עם המזהה שלו',A.recordPayment(M,{bookingId:'x',amount:1,ref:'r',method:'card'}).err==='auth'&&A.exportData(M).err==='auth');
        const hb=A.load().bookings.find(b=>b.userId===B1&&A.ACTIVE.includes(b.status));
        ok('הפרדה: לקוח א׳ לא יכול לבטל הזמנה של ב׳',!hb||A.cancelBooking(A1,hb.id).err==='auth');
        ok('הפרדה: לקוח רגיל לא יכול לפתוח קריאה (רק דיירים)',!!A.openTicket(A1,{kind:'fault',subject:'x',msg:'y'}).err&&!(A.load().tickets||[]).some(k=>k.userId===A1));
        ok('הפרדה: לקוח לא יכול לשריין כדייר',!!A.tenantBook(A1,{date:D2,start:10,hours:1}).err);
        ok('הפרדה: לקוח רגיל לא יכול לבטל מנוי שאין לו / של אחר',!!A.cancelMembership(B1).err);
        await A.signIn({email:'dup-tenant@test.example',password:'tenant-pass-2'});const T2=(A.load().users.find(u=>u.email==='dup-tenant@test.example')||{}).id,T1=(A.load().users.find(u=>u.email==='tenant@test.example')||{}).id;
        const tkO1=(A.load().tickets||[]).find(k=>k.officeId!=='O2');
        ok('הפרדה: דייר משרד O2 לא יכול לכתוב בקריאה של משרד אחר',!tkO1||A.postTicketMsg(T2,tkO1.id,'x').err==='auth');
        ok('הפרדה: דייר לא יכול לעדכן סטטוס קריאה (רק מנהל)',!tkO1||A.updateTicket(T2,tkO1.id,{status:'closed'}).err==='auth');
        const own=A.openTicket(T2,{kind:'request',subject:'בקשה',msg:'בדיקת הפרדה'});
        ok('הפרדה: דייר פותח קריאה במשרד שלו בלבד',own.ticket&&own.ticket.officeId==='O2',own.err);
        ok('הפרדה: דייר מחובר לא יכול לפעול בשם דייר אחר',!T1||A.tenantBook(T1,{date:D2,start:11,hours:1}).err==='auth');
        A.signOut();await A.adminSignIn({email:'admin@test.example',password:'admin-password-1'});
        ok('הפרדה: מנהל מחובר עונה בכל קריאה',!!A.postTicketMsg(M,own.ticket.id,'מענה').ticket);
        ok('הפרדה: מנהל מחובר לא יכול לפעול בשם לקוח',A.createHold(A1,{roomId:'R1',date:D2,start:9,end:12}).err==='auth');
        A.adminSignOut();A._strict(false);}
    }catch(e){R.push({name:'שגיאה בהרצה',pass:false,detail:String(e&&e.message||e)})}
    A._wipe();
    this.setState({results:R,done:true});
  }
  renderVals(){const R=this.state.results,f=R.filter(r=>!r.pass).length;
    return{results:R.map(r=>({name:r.name,detail:r.detail,mark:r.pass?'✓':'✗',color:r.pass?'#efe9dc':'#ff8a7a'})),summary:this.state.done?(f?f+' נכשלו מתוך '+R.length:'כל '+R.length+' הבדיקות עברו'):'מריץ בדיקות…',sumColor:f?'#ff8a7a':'#e0c288',rerun:()=>this.runAll()}}
}
</script>
